<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCCS-SOC — Authentification</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #111111; --border: #2a1500;
    --accent: #FF6600; --accent2: #FF8C00; --muted: #995200;
    --font-mono: 'Share Tech Mono', monospace; --font-ui: 'Rajdhani', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); font-family: var(--font-ui);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,102,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,102,0,0.05) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none;
  }
  body::after {
    content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(255,102,0,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .login-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 1;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  .logo-wrap {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 36px; justify-content: center;
  }

  .logo-icon {
    width: 52px; height: 52px;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    animation: pulse-border 3s infinite; flex-shrink: 0;
  }

  @keyframes pulse-border {
    0%,100%{box-shadow:0 0 8px rgba(255,102,0,0.5)}
    50%{box-shadow:0 0 28px rgba(255,102,0,1)}
  }

  .logo-icon svg { width: 28px; height: 28px; }

  .logo-text h1 {
    font-family: var(--font-ui); font-size: 26px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent); text-shadow: 0 0 20px rgba(255,102,0,0.7);
  }

  .logo-text p {
    font-family: var(--font-mono); font-size: 9px;
    color: #FFFFFF; letter-spacing: 2px; margin-top: 2px;
  }

  .divider {
    border: none; border-top: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .field-label {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--accent); letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }

  .field-label::before { content: '//'; color: var(--muted); }

  .field-wrap { margin-bottom: 20px; }

  input[type="text"], input[type="password"] {
    width: 100%; background: #0a0a0a;
    border: 1px solid var(--border); color: #FFFFFF;
    font-family: var(--font-mono); font-size: 14px;
    padding: 12px 16px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(255,102,0,0.2);
  }

  input::placeholder { color: #4a3020; }

  .show-pwd {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--muted); letter-spacing: 1px;
    user-select: none;
  }

  .show-pwd:hover { color: var(--accent); }

  .btn-login {
    width: 100%; background: transparent;
    border: 2px solid var(--accent); color: var(--accent);
    font-family: var(--font-ui); font-weight: 700;
    font-size: 14px; letter-spacing: 4px; text-transform: uppercase;
    padding: 14px; cursor: pointer;
    transition: all 0.25s; position: relative; overflow: hidden;
    margin-top: 8px;
  }

  .btn-login::before {
    content: ''; position: absolute; inset: 0;
    background: var(--accent); transform: translateX(-100%);
    transition: transform 0.25s; z-index: -1;
  }

  .btn-login:hover { color: #000; }
  .btn-login:hover::before { transform: translateX(0); }

  .footer-info {
    margin-top: 28px; text-align: center;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--muted); letter-spacing: 2px;
  }

  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    background: var(--accent); border-radius: 50%;
    margin-right: 6px; animation: blink 2s step-end infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .error-msg {
    background: rgba(255,34,34,0.1); border: 1px solid rgba(255,34,34,0.4);
    color: #ff6644; font-family: var(--font-mono); font-size: 11px;
    padding: 10px 14px; margin-bottom: 20px; letter-spacing: 1px;
    display: none;
  }

  .error-msg.show { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FF6600" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        <circle cx="12" cy="12" r="4" fill="rgba(255,102,0,0.2)"/>
      </svg>
    </div>
    <div class="logo-text">
      <h1>OCCS-SOC</h1>
      <p>// ORANGE CYBER COMMAND & SECURITY</p>
    </div>
  </div>

  <hr class="divider"/>

  <div id="errorMsg" class="error-msg">
    ✕ &nbsp;Identifiants incorrects. Réessayez.
  </div>

  <form id="loginForm">
    <div class="field-wrap">
      <div class="field-label">Identifiant</div>
      <input type="text" id="username" placeholder="Entrez votre identifiant..." autocomplete="off"/>
    </div>

    <div class="field-wrap">
      <div class="field-label">Mot de passe</div>
      <input type="password" id="password" placeholder="Entrez votre mot de passe..."/>
      <div class="show-pwd" onclick="togglePwd()">
        <span id="eyeIcon">👁</span> AFFICHER LE MOT DE PASSE
      </div>
    </div>

    <button type="submit" class="btn-login">▶ &nbsp;CONNEXION</button>
  </form>

  <div class="footer-info">
    <span class="status-dot"></span>SYSTÈME SÉCURISÉ — ACCÈS RESTREINT
  </div>
</div>

<script>
  function togglePwd(){
    const p=document.getElementById('password');
    p.type=p.type==='password'?'text':'password';
  }

  document.getElementById('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    const user=document.getElementById('username').value.trim();
    const pwd=document.getElementById('password').value;

    // Identifiants (à modifier selon vos besoins)
    const USERS = {
      'Te@mSOC': 'Orangesoc2026!'
    };

    if(USERS[user]&&USERS[user]===pwd){
      sessionStorage.setItem('occs_auth','1');
      window.location.href='app.html';
    }else{
      document.getElementById('errorMsg').classList.add('show');
      document.getElementById('password').value='';
    }
  });

  // Toujours afficher la page de login
  sessionStorage.removeItem('occs_auth');
</script>
</body>
</html>
